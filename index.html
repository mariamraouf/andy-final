<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) — PRODUCTION HOST ONLY.
         The same code is deployed to staging and preview URLs. Firing GA4 and
         Google Ads conversions from those would put fake leads into the numbers
         Cruzian judges its ad spend on, so the tag is only loaded on the real
         domain. Everywhere else gtag is simply never defined, and the helpers in
         src/utils/analytics.ts no-op on their own because they check for it. -->
    <script>
      window.CRUZIAN_IS_PRODUCTION =
        location.hostname === 'thecruzian.com' ||
        location.hostname === 'www.thecruzian.com';

      if (window.CRUZIAN_IS_PRODUCTION) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5LYS1V3QKB';
        document.head.appendChild(s);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-5LYS1V3QKB');
        // Google Ads — same gtag.js, its own account.
        gtag('config', 'AW-18436643903');
      } else {
        // Staging / preview host. Flip the robots meta below to noindex so a
        // copy of the site can never compete with thecruzian.com in search or
        // leak unapproved pricing into a search result.
        document.addEventListener('DOMContentLoaded', function () {
          var m = document.querySelector('meta[name="robots"]');
          if (m) m.setAttribute('content', 'noindex, nofollow');
        });
      }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons. Google's crawler falls back to /favicon.ico when a page does
         not declare an icon it can use, which is why the Dyad scaffold icon was
         showing in search results. Declare the real ones explicitly, and keep a
         48px multiple, which is what Google requires. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
