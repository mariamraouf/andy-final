<!doctype html>

    <!-- Google tag (gtag.js) — PRODUCTION HOST ONLY.
         The same code is deployed to staging and preview URLs. Firing GA4 and
         Google Ads conversions from those would put fake leads into the numbers
         Cruzian judges its ad spend on, so the tag is only loaded on the real
         domain. Everywhere else gtag is simply never defined, and the helpers in
         src/utils/analytics.ts no-op on their own because they check for it. -->
    <script>
      window.CRUZIAN_IS_PRODUCTION =
        location.hostname === 'thecruzian.com' ||
        location.hostname === 'www.thecruzian.com';

      if (window.CRUZIAN_IS_PRODUCTION) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-5LYS1V3QKB';
        document.head.appendChild(s);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ dataLayer.push(arguments); };

        // ── Consent Mode v2 ─────────────────────────────────────────────
        // Must run before any config or event command, or the tags fire
        // before they know what they are allowed to do.
        //
        // Google enforces the European list itself through the region
        // parameter, so those visitors are denied until they choose and
        // everyone else is granted. The most specific region wins regardless
        // of call order. In practice this means Cruzian's Jacksonville
        // traffic measures exactly as it did before.
        var CRUZIAN_EU = ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR',
          'DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO',
          'PL','PT','RO','SK','SI','ES','SE','GB','CH'];

        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          region: CRUZIAN_EU,
          wait_for_update: 500
        });
        gtag('consent', 'default', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });

        // A choice already made, replayed before anything fires.
        var cruzianSaved = null;
        try { cruzianSaved = localStorage.getItem('cruzian_consent'); } catch (e) {}
        if (cruzianSaved === 'granted' || cruzianSaved === 'denied') {
          gtag('consent', 'update', {
            ad_storage: cruzianSaved,
            ad_user_data: cruzianSaved,
            ad_personalization: cruzianSaved,
            analytics_storage: cruzianSaved
          });
        }

        // Meta has no region parameter, so the decision has to be made here.
        // Time zone is the signal: no third-party geo lookup, and nothing
        // about the visitor leaves the page. Imperfect for travellers and
        // VPNs, which is the right way round — it errs toward asking.
        window.CRUZIAN_NEEDS_CONSENT = (function () {
          if (cruzianSaved) return false;
          try {
            return /^Europe\//.test(
              Intl.DateTimeFormat().resolvedOptions().timeZone || ''
            );
          } catch (e) { return false; }
        })();

        gtag('js', new Date());
        gtag('config', 'G-5LYS1V3QKB');
        // Google Ads — same gtag.js, its own account.
        gtag('config', 'AW-18436643903');

        // Meta Pixel 1824003342179202 ("Cruzian Website"), ad account
        // 451381342951705. Same production-only guard as the Google tags: a
        // preview deployment firing Leads would poison the ad optimisation
        // this pixel exists to feed.
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
        t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window,document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        // Paused for anyone who has not consented yet, or has declined.
        // Meta requires this on every page load, before init.
        if (window.CRUZIAN_NEEDS_CONSENT || cruzianSaved === 'denied') {
          fbq('consent', 'revoke');
        }
        fbq('init', '1824003342179202');
        fbq('track', 'PageView');
      } else {
        // Staging / preview host. Flip the robots meta below to noindex so a
        // copy of the site can never compete with thecruzian.com in search or
        // leak unapproved pricing into a search result.
        document.addEventListener('DOMContentLoaded', function () {
          var m = document.querySelector('meta[name="robots"]');
          if (m) m.setAttribute('content', 'noindex, nofollow');
        });
      }
    </script>
