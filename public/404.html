<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | Cruzian</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0B1B3D; color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card { max-width: 560px; }
      .eyebrow {
        font-size: 12px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase;
        color: #CFA349; margin-bottom: 18px;
      }
      h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.05; letter-spacing: -.025em; margin: 0 0 16px; font-weight: 800; }
      p { color: #B9C4DA; font-size: 17px; line-height: 1.6; margin: 0 0 32px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a.btn {
        display: inline-block; text-decoration: none; font-weight: 700; font-size: 15px;
        padding: 14px 26px; border-radius: 14px; transition: background .15s ease;
      }
      a.primary { background: #CFA349; color: #0B1B3D; }
      a.primary:hover { background: #E0BC6B; }
      a.ghost { border: 1px solid rgba(207,163,73,.45); color: #CFA349; }
      a.ghost:hover { background: rgba(207,163,73,.1); }
      .rule { height: 3px; width: 64px; background: #CFA349; margin: 40px 0 18px; opacity: .9; }
      .mark { font-size: 13px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: #fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Error 404</div>
      <h1>That page moved, or never existed.</h1>
      <p>
        Either way, you're one click from what you came for. Most people land here
        looking for what we actually do, or to book the free 45-minute audit.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn ghost" href="/services">See the services</a>
        <a class="btn ghost" href="/contact">Book the free audit</a>
      </div>
      <div class="rule"></div>
      <div class="mark">Cruzian</div>
    </div>
  </body>
</html>
